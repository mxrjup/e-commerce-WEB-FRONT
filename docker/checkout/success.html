<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Paiement terminé · log</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 16px; text-align: center; color: #1a1a1a; background: #fafafa; }
      main { max-width: 420px; margin: 0 auto; }
      a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 8px; background: #1a1a1a; color: #fff; text-decoration: none; }
      @media (prefers-color-scheme: dark) { body { color: #f2f2f2; background: #121212; } a { background: #f2f2f2; color: #121212; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Paiement terminé</h1>
      <p>Votre paiement a été accepté. Retour à l'application…</p>
      <a id="open" href="ecommerce://checkout-success">Retourner dans l'application</a>
    </main>
    <script>
      // Stripe ajoute session_id ; il est transmis tel quel a l'application.
      var link = 'ecommerce://checkout-success' + window.location.search;
      document.getElementById('open').href = link;
      window.location.replace(link);
    </script>
  </body>
</html>
