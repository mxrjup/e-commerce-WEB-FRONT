# Le back-office, servi par nginx sans root (image nginx-unprivileged, port 8080).
# Derriere l'Ingress : /api et /auth vont a la gateway et a Keycloak, tout le reste
# arrive ici.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Sonde Kubernetes, sans journal.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers produits par Vite, nommes par leur contenu : jamais modifies.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Application monopage : toute autre route est celle de React Router.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
